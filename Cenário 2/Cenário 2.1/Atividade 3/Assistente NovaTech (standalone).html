document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"dfc089c6-4926-41ae-9569-00bd436ef415\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>\n  *{box-sizing:border-box}\n  body{margin:0;background:#e7e6e6;font-family:'Segoe UI','Segoe UI Web (West European)',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#242424}\n  ::-webkit-scrollbar{width:10px;height:10px}\n  ::-webkit-scrollbar-thumb{background:#c7c7c7;border-radius:5px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;background:#e7e6e6;padding:40px 24px 80px\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n\n    <!-- ===== Page header ===== -->\n    <header style=\"margin-bottom:28px\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:10px\">\n        <div style=\"width:34px;height:34px;border-radius:9px;background:#0e7c86;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;letter-spacing:-.5px\">N<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:600;color:#0e7c86;letter-spacing:.04em;text-transform:uppercase\">Assistente NovaTech · Query Endpoint<\u002Fdiv>\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font-size:30px;font-weight:700;letter-spacing:-.6px;color:#1b1b1b\">Interface de resposta no Microsoft Teams<\u002Fh1>\n      <p style=\"margin:8px 0 0;font-size:15px;line-height:1.55;color:#525252;max-width:760px\">Mockup de alta fidelidade do assistente corporativo de RAG usado por atendentes de logística. Toda resposta carrega fonte, nível de confiança, documento vigente e rastreabilidade — os guardrails G1–G6 são visíveis na própria tela.<\u002Fp>\n    <\u002Fheader>\n\n    <!-- ===== State selector ===== -->\n    <div style=\"margin-bottom:18px\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a8886;margin-bottom:10px\">Estados representados<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"4\">\n          <sc-if value=\"{{ tab.isActive }}\" hint-placeholder-val=\"{{ true }}\">\n            <button onclick=\"{{ tab.onClick }}\" style=\"flex:1;min-width:210px;text-align:left;cursor:pointer;border:1.5px solid #0e7c86;background:#0e7c86;color:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 4px 14px rgba(14,124,134,.28)\">\n              <div style=\"font-size:14px;font-weight:700\">{{ tab.label }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;margin-top:3px;opacity:.85;line-height:1.35\">{{ tab.desc }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ tab.isInactive }}\" hint-placeholder-val=\"{{ false }}\">\n            <button onclick=\"{{ tab.onClick }}\" style=\"flex:1;min-width:210px;text-align:left;cursor:pointer;border:1.5px solid #e0dfde;background:#fff;color:#3b3a39;border-radius:10px;padding:12px 14px\" style-hover=\"border-color:#0e7c86\">\n              <div style=\"font-size:14px;font-weight:700\">{{ tab.label }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;margin-top:3px;color:#8a8886;line-height:1.35\">{{ tab.desc }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== TEAMS WINDOW ===== -->\n    <div style=\"border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.20);border:1px solid #d6d5d4;background:#fff\">\n      <!-- title bar -->\n      <div style=\"height:48px;background:#5b5fc7;display:flex;align-items:center;padding:0 16px;gap:14px\">\n        <div style=\"display:flex;gap:8px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ffffff55\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffffff55\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#ffffff55\"><\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;display:flex;justify-content:center\">\n          <div style=\"background:#ffffff22;border-radius:6px;height:30px;width:420px;display:flex;align-items:center;padding:0 12px;color:#ffffffcc;font-size:13px\">Pesquisar (Ctrl+E)<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:30px;height:30px;border-radius:50%;background:#e8a33d;color:#3b2a00;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700\">RM<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;height:660px\">\n        <!-- app rail -->\n        <div style=\"width:68px;background:#ebebfa;border-right:1px solid #e0dffa;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:18px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;color:#5b5fc7;opacity:.6\"><span style=\"width:22px;height:22px;border-radius:6px;border:2px solid currentColor\"><\u002Fspan><span style=\"font-size:9px\">Atividade<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;color:#5b5fc7;opacity:.6\"><span style=\"width:22px;height:18px;border-radius:5px;border:2px solid currentColor\"><\u002Fspan><span style=\"font-size:9px\">Chat<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;color:#5b5fc7;position:relative\">\n            <span style=\"width:24px;height:24px;border-radius:7px;background:#0e7c86;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700\">N<\u002Fspan>\n            <span style=\"font-size:9px;font-weight:700\">NovaTech<\u002Fspan>\n            <span style=\"position:absolute;left:-14px;top:2px;width:3px;height:24px;border-radius:2px;background:#5b5fc7\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;color:#5b5fc7;opacity:.6\"><span style=\"width:22px;height:22px;border-radius:50%;border:2px solid currentColor\"><\u002Fspan><span style=\"font-size:9px\">Calendário<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- conversation list -->\n        <div style=\"width:248px;background:#f5f5fb;border-right:1px solid #e6e6ef;padding:14px 0;display:flex;flex-direction:column\">\n          <div style=\"padding:0 16px 12px;font-size:17px;font-weight:700;color:#242424\">Assistente NovaTech<\u002Fdiv>\n          <div style=\"padding:0 12px 10px\"><div style=\"background:#fff;border:1px solid #e0dfde;border-radius:6px;height:32px;display:flex;align-items:center;padding:0 10px;font-size:12.5px;color:#8a8886\">Buscar em chamados<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8886;padding:6px 16px 4px\">Recentes<\u002Fdiv>\n          <div style=\"background:#e8e8f8;border-left:3px solid #5b5fc7;padding:10px 14px;display:flex;gap:10px;align-items:center\">\n            <span style=\"width:32px;height:32px;border-radius:50%;background:#0e7c86;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none\">N<\u002Fspan>\n            <div style=\"min-width:0\"><div style=\"font-size:13.5px;font-weight:700;color:#242424\">Assistente NovaTech<\u002Fdiv><div style=\"font-size:11.5px;color:#616161;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ question }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:10px 14px;display:flex;gap:10px;align-items:center;opacity:.7\">\n            <span style=\"width:32px;height:32px;border-radius:50%;background:#c7c7d9;color:#3b3a39;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none\">SL<\u002Fspan>\n            <div style=\"min-width:0\"><div style=\"font-size:13.5px;font-weight:600;color:#242424\">Supervisão · Logística<\u002Fdiv><div style=\"font-size:11.5px;color:#616161\">Canal de escalação<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- chat thread -->\n        <div style=\"flex:1;display:flex;flex-direction:column;background:#fff;min-width:0\">\n          <!-- chat header -->\n          <div style=\"height:60px;border-bottom:1px solid #ededed;display:flex;align-items:center;padding:0 22px;gap:12px;flex:none\">\n            <span style=\"width:36px;height:36px;border-radius:50%;background:#0e7c86;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px\">N<\u002Fspan>\n            <div style=\"flex:1\">\n              <div style=\"font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px\">Assistente NovaTech <span style=\"font-size:10px;font-weight:700;background:#eef3ff;color:#3a55b8;border:1px solid #d6e0ff;border-radius:4px;padding:1px 6px;letter-spacing:.03em\">BOT · RAG<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12px;color:#616161\">Consulta base de conhecimento operacional · documentos vigentes<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a8886;border:1px solid #e0dfde;border-radius:6px;padding:5px 10px\">{{ ticket }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- messages -->\n          <div style=\"flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:18px\">\n\n            <!-- user question -->\n            <div style=\"display:flex;justify-content:flex-end\">\n              <div style=\"max-width:74%\">\n                <div style=\"background:#5b5fc7;color:#fff;border-radius:8px 8px 2px 8px;padding:11px 14px;font-size:14px;line-height:1.5\">{{ question }}<\u002Fdiv>\n                <div style=\"text-align:right;font-size:11px;color:#8a8886;margin-top:4px\">Você · {{ time }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- assistant structured response card -->\n            <div style=\"display:flex;gap:10px;align-items:flex-start\">\n              <span style=\"width:30px;height:30px;border-radius:50%;background:#0e7c86;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;margin-top:2px\">N<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:baseline;gap:8px;margin-bottom:6px\">\n                  <span style=\"font-size:13px;font-weight:700;color:#242424\">Assistente NovaTech<\u002Fspan>\n                  <span style=\"font-size:11px;color:#8a8886\">{{ time }} · {{ ticket }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <div style=\"border:1px solid #e6e6e6;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04)\">\n\n                  <!-- CONFLICT alert banner -->\n                  <sc-if value=\"{{ conflict }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"background:#fdf0e3;border-bottom:1px solid #f3d9bb;padding:13px 16px;display:flex;gap:11px;align-items:flex-start\">\n                      <span style=\"width:22px;height:22px;border-radius:50%;background:#c05621;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none\">!<\u002Fspan>\n                      <div><div style=\"font-size:13.5px;font-weight:700;color:#9a3d0f\">Documentos contraditórios detectados<\u002Fdiv><div style=\"font-size:12.5px;color:#8a4a20;line-height:1.5;margin-top:2px\">{{ conflictNote }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <div style=\"padding:18px 18px 4px\">\n\n                    <!-- ① RESPOSTA (generated) -->\n                    <div style=\"margin-bottom:18px\">\n                      <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:7px\">\n                        <span style=\"width:14px;height:14px;border-radius:4px;background:#0e7c86;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800\">✦<\u002Fspan>\n                        <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0e7c86\">Resposta gerada pelo assistente<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ showAnswer }}\" hint-placeholder-val=\"{{ true }}\">\n                        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#1b1b1b\">{{ answer }}<\u002Fp>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ conflict }}\" hint-placeholder-val=\"{{ false }}\">\n                        <p style=\"margin:0 0 12px;font-size:14px;line-height:1.6;color:#1b1b1b\">Há <b>duas versões vigentes divergentes<\u002Fb> sobre este tema. O assistente não escolhe entre elas — as duas são apresentadas abaixo para decisão humana.<\u002Fp>\n                        <div style=\"display:flex;flex-direction:column;gap:10px\">\n                          <sc-for list=\"{{ sources }}\" as=\"src\" hint-placeholder-count=\"2\">\n                            <div style=\"border:1px solid #f0d6bd;background:#fffaf4;border-radius:9px;padding:12px 13px\">\n                              <div style=\"font-size:11px;font-weight:700;color:#c05621;margin-bottom:4px\">VERSÃO {{ src.letter }} · {{ src.code }}<\u002Fdiv>\n                              <div style=\"font-size:14px;line-height:1.5;color:#1b1b1b\">{{ src.claim }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ gap }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"border:1px dashed #c7c7c7;background:#fafafa;border-radius:9px;padding:14px 15px\">\n                          <div style=\"font-size:13px;font-weight:700;color:#5c5c5c;margin-bottom:4px\">Nenhuma informação encontrada na base<\u002Fdiv>\n                          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3b3a39\">{{ gapText }}<\u002Fp>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n\n                    <!-- ② NÍVEL DE CONFIANÇA -->\n                    <div style=\"margin-bottom:18px;border-top:1px solid #f0f0f0;padding-top:16px\">\n                      <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8886;margin-bottom:9px\">Nível de confiança<\u002Fdiv>\n                      <sc-if value=\"{{ confAlto }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"display:flex;align-items:center;gap:12px\">\n                          <div style=\"display:flex;align-items:center;gap:8px;background:#e3f4ea;border:1px solid #b6e0c6;border-radius:20px;padding:6px 13px\"><span style=\"width:9px;height:9px;border-radius:50%;background:#1a7f43\"><\u002Fspan><span style=\"font-size:13px;font-weight:700;color:#136138\">Alta<\u002Fspan><\u002Fdiv>\n                          <div style=\"display:flex;gap:4px\"><span style=\"width:34px;height:6px;border-radius:3px;background:#1a7f43\"><\u002Fspan><span style=\"width:34px;height:6px;border-radius:3px;background:#1a7f43\"><\u002Fspan><span style=\"width:34px;height:6px;border-radius:3px;background:#1a7f43\"><\u002Fspan><\u002Fdiv>\n                          <span style=\"font-size:12.5px;color:#616161\">Fonte única, vigente e diretamente aplicável.<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ confMedio }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;align-items:center;gap:12px\">\n                          <div style=\"display:flex;align-items:center;gap:8px;background:#fdf3d8;border:1px solid #ecd591;border-radius:20px;padding:6px 13px\"><span style=\"width:9px;height:9px;border-radius:50%;background:#9a6700\"><\u002Fspan><span style=\"font-size:13px;font-weight:700;color:#7a5200\">Média<\u002Fspan><\u002Fdiv>\n                          <div style=\"display:flex;gap:4px\"><span style=\"width:34px;height:6px;border-radius:3px;background:#9a6700\"><\u002Fspan><span style=\"width:34px;height:6px;border-radius:3px;background:#9a6700\"><\u002Fspan><span style=\"width:34px;height:6px;border-radius:3px;background:#eadfc2\"><\u002Fspan><\u002Fdiv>\n                          <span style=\"font-size:12.5px;color:#616161\">Múltiplas fontes vigentes em conflito.<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ confBaixo }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;align-items:center;gap:12px\">\n                          <div style=\"display:flex;align-items:center;gap:8px;background:#fdecea;border:1px solid #f3c0bb;border-radius:20px;padding:6px 13px\"><span style=\"width:9px;height:9px;border-radius:50%;background:#b42318\"><\u002Fspan><span style=\"font-size:13px;font-weight:700;color:#912018\">Baixa<\u002Fspan><\u002Fdiv>\n                          <div style=\"display:flex;gap:4px\"><span style=\"width:34px;height:6px;border-radius:3px;background:#b42318\"><\u002Fspan><span style=\"width:34px;height:6px;border-radius:3px;background:#f3cdc9\"><\u002Fspan><span style=\"width:34px;height:6px;border-radius:3px;background:#f3cdc9\"><\u002Fspan><\u002Fdiv>\n                          <span style=\"font-size:12.5px;color:#616161\">Cobertura parcial / tangencial.<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ confNone }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;align-items:center;gap:12px\">\n                          <div style=\"display:flex;align-items:center;gap:8px;background:#f3f3f3;border:1px solid #dcdcdc;border-radius:20px;padding:6px 13px\"><span style=\"width:9px;height:9px;border-radius:50%;background:#8a8886\"><\u002Fspan><span style=\"font-size:13px;font-weight:700;color:#5c5c5c\">Não aplicável<\u002Fspan><\u002Fdiv>\n                          <span style=\"font-size:12.5px;color:#616161\">Sem cobertura documental — lacuna declarada.<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n\n                    <!-- ③ FONTES -->\n                    <div style=\"margin-bottom:18px;border-top:1px solid #f0f0f0;padding-top:16px\">\n                      <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8886;margin-bottom:9px\">Fontes documentais<\u002Fdiv>\n                      <sc-if value=\"{{ hasSources }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"display:flex;flex-direction:column;gap:10px\">\n                          <sc-for list=\"{{ sources }}\" as=\"src\" hint-placeholder-count=\"1\">\n                            <div style=\"border:1px solid #e6e6e6;border-radius:9px;padding:11px 13px;background:#fbfbfb\">\n                              <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                                <span style=\"font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;font-weight:700;background:#eef3ff;color:#2f4bb0;border:1px solid #d6e0ff;border-radius:5px;padding:2px 8px\">{{ src.code }}<\u002Fspan>\n                                <span style=\"font-size:13.5px;font-weight:600;color:#242424\">{{ src.title }}<\u002Fspan>\n                                <span style=\"font-family:'SFMono-Regular',Consolas,monospace;font-size:11.5px;color:#8a8886\">{{ src.version }}<\u002Fspan>\n                                <sc-if value=\"{{ src.isVigente }}\" hint-placeholder-val=\"{{ true }}\">\n                                  <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:#e3f4ea;color:#136138;border:1px solid #b6e0c6;border-radius:5px;padding:2px 8px\">✓ Versão vigente<\u002Fspan>\n                                <\u002Fsc-if>\n                                <sc-if value=\"{{ src.isTransicao }}\" hint-placeholder-val=\"{{ false }}\">\n                                  <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:#fdf3d8;color:#7a5200;border:1px solid #ecd591;border-radius:5px;padding:2px 8px\">↻ Em transição<\u002Fspan>\n                                <\u002Fsc-if>\n                              <\u002Fdiv>\n                              <div style=\"font-size:12.5px;color:#525252;margin-top:6px\"><b style=\"color:#3b3a39\">Seção utilizada:<\u002Fb> {{ src.section }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ gap }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-size:13px;color:#8a8886;font-style:italic\">Nenhuma fonte vigente corresponde a esta consulta. Nada foi citado para evitar resposta sem lastro documental (G2).<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n\n                    <!-- ④ TRECHOS LITERAIS -->\n                    <sc-if value=\"{{ hasSources }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"margin-bottom:18px;border-top:1px solid #f0f0f0;padding-top:16px\">\n                      <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:9px\">\n                        <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8886\">Trechos literais do documento<\u002Fspan>\n                        <span style=\"font-size:10px;font-weight:600;background:#f0f0f0;color:#616161;border-radius:4px;padding:1px 7px\">conteúdo documentado · não gerado<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:10px\">\n                        <sc-for list=\"{{ sources }}\" as=\"src\" hint-placeholder-count=\"1\">\n                          <div style=\"border-left:3px solid #0e7c86;background:#f4f9fa;border-radius:0 8px 8px 0;padding:11px 14px\">\n                            <div style=\"font-size:14px;line-height:1.6;color:#1b3a3d;font-style:italic\">{{ src.excerpt }}<\u002Fdiv>\n                            <div style=\"font-size:11px;color:#5c7c80;margin-top:6px;font-family:'SFMono-Regular',Consolas,monospace\">— {{ src.code }} {{ src.version }}, {{ src.section }}<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <!-- ⑤ ORIENTAÇÃO DE USO -->\n                    <div style=\"margin-bottom:16px;border-top:1px solid #f0f0f0;padding-top:16px\">\n                      <div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8886;margin-bottom:8px\">Orientação de uso<\u002Fdiv>\n                      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#3b3a39\">{{ guidance }}<\u002Fp>\n                    <\u002Fdiv>\n\n                    <!-- escalation suggestion -->\n                    <sc-if value=\"{{ escalate }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"background:#eef3ff;border:1px solid #cdd9f7;border-radius:10px;padding:13px 14px;margin-bottom:16px;display:flex;gap:11px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n                        <div style=\"display:flex;gap:10px;align-items:center;min-width:0\">\n                          <span style=\"width:24px;height:24px;border-radius:6px;background:#3a55b8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none\">↑<\u002Fspan>\n                          <div style=\"font-size:13px;color:#2f3f86;line-height:1.45\">{{ escalateText }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <button style=\"cursor:pointer;border:none;background:#3a55b8;color:#fff;font-size:12.5px;font-weight:700;border-radius:6px;padding:8px 14px;flex:none\" style-hover=\"background:#2f4496\">Escalar ao supervisor<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                  <\u002Fdiv>\n\n                  <!-- card footer: timestamp + audit -->\n                  <div style=\"background:#fafafa;border-top:1px solid #f0f0f0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n                    <div style=\"font-size:11.5px;color:#8a8886;display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#8a8886\"><\u002Fspan>Consulta registrada em {{ time }} · {{ ticket }}<\u002Fdiv>\n                    <div style=\"display:flex;gap:14px\">\n                      <span style=\"font-size:11.5px;color:#8a8886;cursor:pointer\" style-hover=\"color:#0e7c86\">Trechos rastreados ↗<\u002Fspan>\n                      <span style=\"font-size:11.5px;color:#8a8886;cursor:pointer\" style-hover=\"color:#0e7c86\">Reportar feedback<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- composer -->\n          <div style=\"border-top:1px solid #ededed;padding:14px 22px;flex:none\">\n            <div style=\"border:1px solid #d6d5d4;border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:10px\">\n              <div style=\"flex:1;font-size:13.5px;color:#8a8886\">Faça uma pergunta sobre prazos, frete, devoluções ou SLAs…<\u002Fdiv>\n              <button style=\"border:none;background:#5b5fc7;color:#fff;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:14px\">➤<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#a19f9d;margin-top:7px\">As respostas são compostas a partir de documentos formais vigentes. Sempre confira a fonte antes de comunicar ao cliente.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ DELIVERABLE DOCS ============ -->\n\n    <!-- Wireframe anotado -->\n    <section style=\"margin-top:46px\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0e7c86;margin-bottom:6px\">Entregável 02<\u002Fdiv>\n      <h2 style=\"margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.4px\">Wireframe anotado<\u002Fh2>\n      <p style=\"margin:0 0 20px;font-size:14px;color:#616161;max-width:720px\">Estrutura esquemática do card de resposta. Cada elemento mapeia para um requisito obrigatório e a um guardrail.<\u002Fp>\n\n      <div style=\"display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start\">\n        <!-- schematic -->\n        <div style=\"flex:1;min-width:340px;background:#fff;border:1px solid #e0dfde;border-radius:12px;padding:20px\">\n          <div style=\"border:1.5px dashed #c7c7c7;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;justify-content:flex-end\"><div style=\"background:#ececf6;border-radius:6px;height:34px;width:60%;position:relative\"><span style=\"position:absolute;left:-12px;top:7px;width:22px;height:22px;border-radius:50%;background:#0e7c86;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center\">1<\u002Fspan><\u002Fdiv><\u002Fdiv>\n "font-size:12.5px;color:#616161;line-height:1.5\">{{ f.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#525252;background:#fff;border:1px solid #e8e8e8;border-radius:11px;padding:14px 16px;margin-top:4px;line-height:1.55\"><b>Meta operacional:<\u002Fb> resposta confiável e rastreável em menos de 30 segundos. A estrutura fixa de 5 campos permite leitura por escaneamento — o atendente vê confiança e fonte sem abrir documentos.<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Justificativa UX -->\n    <section style=\"margin-top:46px\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0e7c86;margin-bottom:6px\">Entregável 05<\u002Fdiv>\n      <h2 style=\"margin:0 0 18px;font-size:24px;font-weight:700;letter-spacing:-.4px\">Justificativa das decisões de UX<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-for list=\"{{ rationale }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"background:#fff;border:1px solid #e8e8e8;border-radius:11px;padding:15px 17px;display:flex;gap:14px;align-items:flex-start\">\n            <span style=\"font-size:11px;font-weight:700;color:#0e7c86;background:#e6f3f4;border-radius:6px;padding:4px 9px;flex:none;white-space:nowrap;margin-top:1px\">{{ r.tag }}<\u002Fspan>\n            <div><div style=\"font-size:14px;font-weight:700;color:#242424;margin-bottom:3px\">{{ r.title }}<\u002Fdiv><div style=\"font-size:13px;color:#525252;line-height:1.55\">{{ r.body }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Mapeamento requisitos -->\n    <section style=\"margin-top:46px\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0e7c86;margin-bottom:6px\">Entregável 06<\u002Fdiv>\n      <h2 style=\"margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-.4px\">Como a interface atende aos requisitos<\u002Fh2>\n      <p style=\"margin:0 0 18px;font-size:14px;color:#616161;max-width:720px\">Cada requisito obrigatório do <code style=\"background:#ececec;padding:1px 5px;border-radius:4px;font-size:12.5px\">requirements.md<\u002Fcode> ↔ elemento visível na tela ↔ guardrail correspondente.<\u002Fp>\n      <div style=\"background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:1.4fr 1.6fr 0.8fr;background:#f5f5f5;border-bottom:1px solid #e8e8e8;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8a8886\">\n          <div style=\"padding:11px 15px\">Requisito<\u002Fdiv><div style=\"padding:11px 15px\">Elemento na interface<\u002Fdiv><div style=\"padding:11px 15px\">Guardrail / VC<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ mapping }}\" as=\"m\" hint-placeholder-count=\"11\">\n          <div style=\"display:grid;grid-template-columns:1.4fr 1.6fr 0.8fr;border-bottom:1px solid #f2f2f2;font-size:13px\">\n            <div style=\"padding:12px 15px;font-weight:600;color:#242424\">{{ m.req }}<\u002Fdiv>\n            <div style=\"padding:12px 15px;color:#525252;line-height:1.5\">{{ m.ui }}<\u002Fdiv>\n            <div style=\"padding:12px 15px\"><span style=\"font-size:11px;font-weight:700;color:#2f4bb0;background:#eef3ff;border:1px solid #d6e0ff;border-radius:5px;padding:2px 8px\">{{ m.gr }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"margin-top:40px;text-align:center;font-size:12px;color:#a19f9d\">Assistente NovaTech · Query Endpoint v1.0 · Mockup de referência para o contexto de Interação com o Atendente<\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240}}\">\nclass Component extends DCLogic {\n  stat de Logística Reversa', version:'v1.4', section:'Seção 2.3 — Janela de Coleta', claim:'A devolução de itens com defeito deve ser registrada em até 30 dias corridos após a entrega.', excerpt:'\"A devolução de itens com defeito deve ser registrada em até 30 dias corridos após a entrega.\"', isVigente:true, isTransicao:false }\n        ],\n        guidance: 'Não comunique um prazo único ao cliente enquanto o conflito não for resolvido por área responsável. Escale ao supervisor.',\n        escalate: true, escalateText: 'Conflito entre documentos vigentes — escale ao supervisor antes de responder ao cliente.'\n      },\n      baixo: {\n        question: 'Há custo adicional de frete para itens frágeis enviados a Manaus?',\n        ticket: 'Chamado #48224',\n        time: '17/06/2026 14:51',\n        showAnswer: true,\n        answer: 'A documentação menciona possíveis acréscimos para regiões remotas, mas não há regra específica para itens frágeis em Manaus. A cobertura encontrada é parcial e não sustenta uma resposta definitiva.',\n        confidence: 'baixo',\n        conflict: false, conflictNote: '', gap: false, gapText: '',\n        sources: [{ code:'SLA-FRT-003', title:'SLA de Frete e Regiões de Atendimento', version:'v1.2', section:'Seção 5 — Regiões Remotas', excerpt:'\"Envios para regiões remotas podem estar sujeitos a acréscimo tarifário, conforme tabela regional vigente.\"', isVigente:false, isTransicao:true }],\n        guidance: 'Não confirme valores ao cliente com base nesta resposta. Valide com o supervisor ou consulte a tabela regional aplicável antes de prosseguir.',\n        escalate: true, escalateText: 'Confiança baixa — recomenda-se validar com o supervisor antes de responder ao cliente.'\n      },\n      lacuna: {\n        question: 'Qual é a política de frete para clientes do tier \"Platinum\"?',\n        ticket: 'Chamado #48231',\n        time: '17/06/2026 15:03',\n        showAnswer: false,\n        answer: '',\n        confidence: null,\n        conflict: false, conflictNote: '',\n        gap: true,\n        gapText: 'Não há cobertura documental para um tier \"Platinum\". A política de níveis vigente (POL-CLI-002) define apenas os tiers Bronze, Prata e Ouro. O assistente não compõe resposta a partir de temas adjacentes nem infere regras inexistentes.',\n        sources: [],\n        guidance: 'Confirme o tier real do cliente. Caso \"Platinum\" seja uma categoria nova, escale para validação documental antes de qualquer comunicação.',\n        escalate: true, escalateText: 'Sem cobertura na base — escale ao supervisor e/ou solicite revisão documental.'\n      }\n    };\n  }\n\n  renderVals() {\n    const key = this.state.key;\n    const sc = this.scenarios()[key];\n    const pick = (k) => this.setState({ key: k });\n    const tabsDef = [\n      ['alto','Alta confiança','Resposta direta, fonte única vigente'],\n      ['conflito','Documentos contraditórios','Duas fontes vigentes divergem'],\n      ['baixo','Baixa confiança','Cobertura parcial / tangencial'],\n      ['lacuna','Nenhuma informação','Sem cobertura na base']\n    ];\n    const tabs = tabsDef.map(([k,label,desc]) => ({ key:k, label, desc, isActive: k===key, isInactive: k!==key, onClick: () => pick(k) }));\n\n    const wire = [\n      { n:1, title:'Pergunta do usuário', desc:'Bolha alinhada à direita, replicada no cabeçalho do card.', tag:'Req · Pergunta' },\n      { n:2, title:'Resposta gerada', desc:'Marcada como \"gerada pelo assistente\" para separar de conteúdo documentado.', tag:'G1 · Gerado' },\n      { n:3, title:'Fonte + ID + seção', desc:'Código do documento, versão e seção utilizada, em chip monoespaçado.', tag:'G2 · Fonte' },\n      { n:4, title:'Trecho literal', desc:'Citação com borda lateral e fundo — visivelmente \"documentado\".', tag:'G2 · Trecho' },\n      { n:5, title:'Orientação de uso', desc:'Como aplicar a resposta com segurança no atendimento.', tag:'C2 · Campo 5' },\n      { n:6, title:'Nível de confiança', desc:'Chip colorido + :'Banner de contradição', body:'Alerta laranja de alta saliência no topo do card, com nota de que um registro de conflito foi gerado (SLA de triagem 2 dias úteis).' },\n      { title:'Faixa de escalação', body:'Callout azul com botão \"Escalar ao supervisor\", exibido em baixa confiança, conflito ou lacuna documental.' }\n    ];\n\n    const flow = [\n      { n:1, title:'Pergunta no chamado', body:'O atendente digita a dúvida no chat do assistente, dentro do contexto do chamado em atendimento.' },\n      { n:2, title:'Recuperação RAG', body:'O assistente busca trechos apenas em documentos vigentes/em transição e compõe a resposta estruturada.' },\n      { n:3, title:'Leitura por escaneamento', body:'O atendente checa primeiro o nível de confiança e o selo de vigência — decisão rápida sobre confiar ou validar.' },\n      { n:4, title:'Verificação da fonte', body:'Confere ID do documento, seção e trecho literal. Pode abrir os trechos rastreados para auditoria.' },\n      { n:5, title:'Aplicar ou escalar', body:'Alta confiança: usa direto. Conflito / baixa confiança / lacuna: aciona \"Escalar ao supervisor\".' }\n    ];\n\n    const rationale = [\n      { tag:'Confiança', title:'Confiança sempre visível e nunca ocultável', body:'O chip de confiança ocupa posição fixa logo após a resposta. Mesmo sem cobertura, mostra \"Não aplicável\" — nunca some, atendendo G3 e evitando excesso de confiança do atendente.' },\n      { tag:'Separação', title:'Gerado vs. documentado fica inconfundível', body:'Cores, ícones e rótulos distintos separam a \"Resposta gerada\" dos \"Trechos literais\". O atendente nunca confunde a paráfrase do assistente com o texto oficial do documento.' },\n      { tag:'Conflito', title:'Contradição é destacada, não resolvida', body:'Em vez de escolher um lado, a tela mostra as duas versões vigentes lado a lado com banner de alerta. O sistema permanece neutro (C5) e empurra a decisão para o humano.' },\n      { tag:'Vigência', title:'Vigência explícita em cada fonte', body:'Selos de \"vigente\" / \"em transição\" deixam claro sobre qual versão a resposta se apoia, essencial quando coexistem múltiplas versões de um documento (C4).' },\n      { tag:'Legibilidade', title:'Densidade calibrada para operação', body:'Hierarquia tipográfica forte, blocos curtos e divisores permitem decidir em menos de 30s sem ler tudo — prioridade para atendentes operacionais sob pressão de tempo.' },\n      { tag:'Padrão', title:'Aderência ao ambiente Teams', body:'Reaproveita layout, tipografia e cromática corporativa do Teams. Curva de aprendizado mínima: o assistente parece parte nativa da ferramenta de trabalho.' }\n    ];\n\n    const mapping = [\n      { req:'Campo da pergunta', ui:'Bolha enviada + repetição no cabeçalho do card', gr:'Pergunta' },\n      { req:'Resposta gerada', ui:'Bloco \"Resposta gerada pelo assistente\" (✦)', gr:'G1' },\n      { req:'Fonte documental', ui:'Card de fonte com título do documento', gr:'G2' },\n      { req:'Identificador do documento', ui:'Chip de código (ex.: POL-LOG-014 v3.1)', gr:'G2 · VC-08' },\n      { req:'Seção utilizada', ui:'Linha \"Seção utilizada\" em cada fonte', gr:'G2 · VC-08' },\n      { req:'Indicador de confiança', ui:'Chip semáforo + medidor de 3 segmentos', gr:'G3 · VC-03' },\n      { req:'Aviso de contradição', ui:'Banner laranja + versões lado a lado', gr:'G4 · VC-04' },\n      { req:'Documento vigente', ui:'Selo \"Versão vigente\" / \"Em transição\"', gr:'C4 · VC-09' },\n      { req:'Escalação ao supervisor', ui:'Faixa azul + botão \"Escalar\"', gr:'VC-04/05' },\n      { req:'Lacuna documental', ui:'Bloco tracejado \"Nenhuma informação\"', gr:'G5 · VC-05' },\n      { req:'Timestamp da consulta', ui:'Rodapé \"Consulta registrada em…\"', gr:'C3 · VC-08' }\n    ];\n\n    return {\n      ...sc,\n      tabs,\n      hasSources: sc.sources.length > 0,\n      confAlto: sc.confidence === 'alto',\n      confMedio: sc.confidence === 'medio',\n      confBaixo: sc.confidence === 'baixo',\n      confNone: sc.confidence === null,\n      wire, components, flow, rationale, mapping\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
